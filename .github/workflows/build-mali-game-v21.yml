                  let x=vaddq_f32(vmulq_n_f32(b0,a[i][0]),vmulq_n_f32(b1,a[i][1]));
                  let x=vaddq_f32(x,vmulq_n_f32(b2,a[i][2]));
                  let x=vaddq_f32(x,vmulq_n_f32(b3,a[i][3]));
                  vst1q_f32(out[i].as_mut_ptr(),x);
              }
              out
          }
          #[cfg(all(test,target_arch="aarch64"))]
          #[test]
          fn h700_neon_matches_scalar() {
              if !std::arch::is_aarch64_feature_detected!("neon") { return; }
              for k in 0..64 {
                  let a=std::array::from_fn(|i| std::array::from_fn(|j| ((k*13+i*7+j*3) as f32-50.0)/17.0));
                  let b=std::array::from_fn(|i| std::array::from_fn(|j| ((k*3+i*11+j*5) as f32-30.0)/19.0));
                  let x=mat_mul_scalar(&a,&b); let y=unsafe { h700_mat_mul_neon(&a,&b) };
                  for i in 0..4 { for j in 0..4 { assert_eq!(x[i][j].to_bits(),y[i][j].to_bits()); } }
              }
          }
          """
          p.write_text(s)
          p=Path('crates/cw-client/src/scene/math.rs'); s=p.read_text()
          a='pub fn pre_multiply(m: &mut D3dMatrix, r: &D3dMatrix) {'
          assert s.count(a)==1
          s=s.replace(a,a+"""
              #[cfg(target_arch = "aarch64")]
              if cw_render::frame::h700_neon_enabled() { unsafe { h700_pre_multiply_neon(m,r) }; return; }
          """)
          s += r"""
          #[cfg(target_arch = "aarch64")]
          #[target_feature(enable = "neon")]
          unsafe fn h700_pre_multiply_neon(m: &mut D3dMatrix, r: &D3dMatrix) {
              use std::arch::aarch64::*;
              let a=vld1q_f32(m[0].as_ptr()); let b=vld1q_f32(m[1].as_ptr());
              let c=vld1q_f32(m[2].as_ptr()); let d=vld1q_f32(m[3].as_ptr());
              for i in 0..4 {
                  let x=if i==0 { vaddq_f32(vmulq_n_f32(a,r[i][0]),vmulq_n_f32(b,r[i][1])) }
                        else { vaddq_f32(vmulq_n_f32(b,r[i][1]),vmulq_n_f32(a,r[i][0])) };
                  let x=vaddq_f32(x,vmulq_n_f32(c,r[i][2]));
                  let x=vaddq_f32(x,vmulq_n_f32(d,r[i][3]));
                  vst1q_f32(m[i].as_mut_ptr(),x);
              }
          }
          """
          p.write_text(s)
          PY_V20
      - name: V21 conservative terrain occlusion
        run: |
          python3 - <<'PY_V21'
          from pathlib import Path
          p=Path('crates/cw-client/src/scene.rs'); s=p.read_text()
          a='pub fn terrain_props('
          assert s.count(a)==1
          # Insert before documentation so doc comments remain attached to terrain_props.
          pos=s.index(a); s=s[:pos]+s[pos:]
          a='    let range = ctx.prop_far + 32.0;'
          assert s.count(a)==1
          s=s.replace(a,a+'\n    let mut h700_occlusion_budget = 512usize;')
          a='            let dist2 = length_sq(float_from_fixed(sub3(centre, cam)));'
          start=s.index('pub fn terrain_props('); end=s.index('pub fn draw_prop(',start)
          t=s[start:end]; assert t.count(a)==1
          t=t.replace(a,'            // Preserve lit and swaying props; bound all three model dimensions.\n            let bound = model.size.iter().map(|&v| v as f32).fold(0.0_f32, f32::max) * p.scale.abs() * 1.5;\n            if p.flags & 5 == 0 && h700_terrain_hidden(ctx, centre, bound, &mut h700_occlusion_budget) { continue; }\n'+a)
          s=s[:start]+t+s[end:]
          s+='\n// V21: a complete opaque cross-section of the camera-to-object pyramid.\n// Unknown columns, holes, water, large bounds and exhausted budget fail open.\nfn h700_terrain_hidden(ctx: &SceneCtx, centre: [i64; 3], radius: f32, budget: &mut usize) -> bool {\n    static ENABLED: std::sync::OnceLock<bool> = std::sync::OnceLock::new();\n    if !*ENABLED.get_or_init(|| std::env::var_os("CW_V21_NO_OCCLUSION").is_none())\n        || ctx.underwater || !radius.is_finite() || radius <= 0.0 || radius > 12.0 || *budget == 0 { return false; }\n    let eye = ctx.gc.camera.position.map(|v| v as f64 / 65536.0);\n    let target = centre.map(|v| v as f64 / 65536.0);\n    let d: [f64; 3] = std::array::from_fn(|i| target[i] - eye[i]);\n    let axis = if d[0].abs() >= d[1].abs() { 0 } else { 1 };\n    let other = 1 - axis;\n    let r = radius as f64 + 1.0;\n    if d[axis].abs() < 12.0 + r { return false; }\n    // Check only nearby, full-detail terrain; at most three candidate planes.\n    for step in [4.0_f64, 8.0, 12.0] {\n        let plane = (eye[axis] + step * d[axis].signum()).floor() + 0.5;\n        let a = (plane - eye[axis]) / (d[axis] - r);\n        let b = (plane - eye[axis]) / (d[axis] + r);\n        if a.min(b) <= 0.0 || a.max(b) >= 1.0 { continue; }\n        let bounds = |i: usize| {\n            let v = [a*(d[i]-r), a*(d[i]+r), b*(d[i]-r), b*(d[i]+r)];\n            let lo = v.iter().copied().fold(f64::INFINITY, f64::min);\n            let hi = v.iter().copied().fold(f64::NEG_INFINITY, f64::max);\n            ((eye[i]+lo-0.01).floor() as i32, (eye[i]+hi+0.01).floor() as i32)\n        };\n        let (lo, hi) = bounds(other); let (zl, zh) = bounds(2);\n        if hi-lo > 12 || zh-zl > 12 { continue; }\n        let mut solid = true;\n        \'cells: for u in lo..=hi { for z in zl..=zh {\n            if *budget == 0 { return false; } *budget -= 1;\n            let mut xy = [0; 2]; xy[axis] = plane.floor() as i32; xy[other] = u;\n            let Some(col) = cw_render::light::ColumnAccess::column(ctx.world, xy[0], xy[1]) else { solid = false; break \'cells; };\n            // Only explicitly stored opaque terrain, not synthetic underground blocks.\n            let Some(block) = z.checked_sub(col.height).and_then(|i| usize::try_from(i).ok()).and_then(|i| col.blocks.get(i)) else { solid = false; break \'cells; };\n            if block[3] & 0x1f != 1 { solid = false; break \'cells; }\n        }}\n        if solid { return true; }\n    }\n    false\n}\n'
          p.write_text(s)
          PY_V21
      - name: Build ARM64
        env:
          RUSTFLAGS: '-C target-cpu=cortex-a53'
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
        run: cargo build --release -p cw-client -p cw-server
      - name: Check NEON matrix parity
        env:
          RUSTFLAGS: '-C target-cpu=cortex-a53'
        run: cargo test --release -p cw-render --lib h700_neon_matches_scalar
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/cw-client dist/cw-client-mali-v21
          cp target/release/cw-server dist/cw-server
          file dist/*
          (cd dist && sha256sum cw-client-mali-v21 cw-server > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: CubeWorld-Mali-Native-H700-V21
          path: dist/
          if-no-files-found: error
