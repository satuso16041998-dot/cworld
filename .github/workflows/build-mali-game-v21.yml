          p=Path('crates/cw-render/src/mesh.rs')
          with p.open('a') as f: f.write(r'''
          // Model-local clustering; retain extents and reject empty or ineffective reductions.
          pub fn h700_model_lod(mesh: &ModelMesh, step: u8) -> Option<ModelMesh> {
              use std::collections::{HashMap,HashSet};
              let mut lo=[255u8;3]; let mut hi=[0u8;3];
              for v in &mesh.vertices { for a in 0..3 {lo[a]=lo[a].min(v.pos[a]);hi[a]=hi[a].max(v.pos[a]);} }
              let snap=|mut v:WorldVertex| { for a in 0..3 {let n=v.pos[a]; if n!=lo[a] && n!=hi[a] {let q=u16::from(step);v.pos[a]=((u16::from(n)+q/2)/q*q).clamp(u16::from(lo[a]),u16::from(hi[a])) as u8;}} v };
              let mut out=ModelMesh::default(); let mut map=HashMap::<WorldVertex,u16>::new(); let mut seen=HashSet::new();
              for t in mesh.indices.chunks_exact(3) {
                  let vs=[snap(mesh.vertices[t[0] as usize]),snap(mesh.vertices[t[1] as usize]),snap(mesh.vertices[t[2] as usize])];
                  let a=vs[0].pos;let b=vs[1].pos;let c=vs[2].pos;
                  let u=std::array::from_fn::<_,3,_>(|i|i32::from(b[i])-i32::from(a[i]));
                  let v=std::array::from_fn::<_,3,_>(|i|i32::from(c[i])-i32::from(a[i]));
                  if [u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]]==[0;3] {continue;}
                  let mut ids=[0u16;3]; for (i,v) in vs.into_iter().enumerate() { if let Some(&id)=map.get(&v) {ids[i]=id;} else {let id=u16::try_from(out.vertices.len()).ok()?;out.vertices.push(v);map.insert(v,id);ids[i]=id;} }
                  let mut key=ids;key.sort_unstable();if seen.insert(key) {out.indices.extend_from_slice(&ids);}
              }
              if out.indices.is_empty() || out.indices.len()*5>=mesh.indices.len()*4 {None} else {Some(out)}
          }
          ''')
          PY_V9
