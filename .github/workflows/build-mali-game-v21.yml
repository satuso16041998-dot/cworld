          // H700 visual-only terrain LOD. World data and water indices remain unchanged.
          pub fn h700_lod_level(b: &ChunkBuild, player: [i64;3], old: u8) -> u8 {
              static PROFILE: std::sync::OnceLock<(f64,f64,f64)> = std::sync::OnceLock::new();
              let &(a,c,d)=PROFILE.get_or_init(|| {
                  if std::env::var_os("CW_V6_NO_LOD").is_some() { return (f64::INFINITY,f64::INFINITY,f64::INFINITY); }
                  match std::env::var("CW_V5_PROFILE").as_deref() {
                      Ok("balanced") => (48.,f64::INFINITY,f64::INFINITY), Ok("potato") => (32.,56.,f64::INFINITY), _ => (40.,f64::INFINITY,f64::INFINITY)
