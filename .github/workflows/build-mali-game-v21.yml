              });
              let gap=|i:usize| ((b.bounds_min[i]-player[i]).max(player[i]-b.bounds_max[i]).max(0) as f64)/65536.;
              let dist=gap(0).hypot(gap(1));
              let edge=|t:f64, level:u8| if old>=level {t-4.} else if old!=0 {t+4.} else {t};
              if dist>=edge(d,8) {8} else if dist>=edge(c,4) {4} else if dist>=edge(a,2) {2} else {1}
          }
          pub fn h700_lod(b: &ChunkBuild, step: u8) -> ChunkBuild {
              use std::collections::{HashMap,HashSet};
              let mut out=b.clone();
              if step<=1 {return out;}
              for slab in &mut out.buffers {
                  let original=std::mem::take(&mut slab.vertices);
                  let opaque=std::mem::take(&mut slab.indices);
                  let water=std::mem::take(&mut slab.indices2);
                  let mut map=HashMap::<WorldVertex,u32>::new();
                  let vertices=&mut slab.vertices;
                  let mut intern=|v:WorldVertex| -> u32 { *map.entry(v).or_insert_with(|| {let i=vertices.len() as u32; vertices.push(v); i}) };
                  let snap=|mut v:WorldVertex| {
                      // Preserve the entire perimeter and slab seams. Only interior terrain is clustered.
                      if v.pos[0]==0 || v.pos[0]>=32 || v.pos[1]==0 || v.pos[1]>=32 || v.pos[2]==0 || v.pos[2]>=249 {return v;}
                      for i in 0..3 {let n=v.pos[i] as u16; let q=step as u16; let max=if i==2 {248} else {31}; v.pos[i]=(((n+q/2)/q*q).clamp(1,max)) as u8;}
                      // Keep face normals; reduce colour variations only in interior.
                      v.color=(v.color & 0xff000000)|(v.color & 0x00f8f8f8); v
                  };
                  let mut seen=HashSet::new();
                  for tri in opaque.chunks_exact(3) {
                      let vs=[snap(original[tri[0] as usize]),snap(original[tri[1] as usize]),snap(original[tri[2] as usize])];
                      let a=vs[0].pos; let b=vs[1].pos; let c=vs[2].pos;
                      let u=[b[0] as i32-a[0] as i32,b[1] as i32-a[1] as i32,b[2] as i32-a[2] as i32];
                      let v=[c[0] as i32-a[0] as i32,c[1] as i32-a[1] as i32,c[2] as i32-a[2] as i32];
                      if [u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]]==[0;3] {continue;}
                      let ids=[intern(vs[0]),intern(vs[1]),intern(vs[2])]; let mut key=ids; key.sort_unstable();
                      if seen.insert(key) {slab.indices.extend_from_slice(&ids);}
                  }
                  for i in water {slab.indices2.push(intern(original[i as usize]));}
              }
              out.vertex_count=out.buffers.iter().map(|s|s.vertices.len()).sum(); out
          }
          """)
