          -    pub surface: wgpu::Surface<'w>,
          +    pub surface: Option<wgpu::Surface<'w>>,
               /// Current surface configuration.
               pub config: wgpu::SurfaceConfiguration,
               /// Non-sRGB format the surface texture is viewed and rendered as.
          @@ -243,7 +243,15 @@
                   surface.configure(&device, &config);
                   let depth = create_depth_texture_ms(&device, config.width, config.height, 1);
                   let depth_view = depth.create_view(&wgpu::TextureViewDescriptor::default());
          -        Ok(Self { instance, adapter, device, queue, surface, config, color_format, depth, depth_view, sample_count: 1, msaa_view: None, capture_requested: false, captured: None })
          +        Ok(Self { instance, adapter, device, queue, surface: Some(surface), config, color_format, depth, depth_view, sample_count: 1, msaa_view: None, capture_requested: false, captured: None })
          +    }
          +
          +    pub fn external(instance: wgpu::Instance, adapter: wgpu::Adapter, device: wgpu::Device, queue: wgpu::Queue, width: u32, height: u32) -> Self {
          +        let color_format = wgpu::TextureFormat::Rgba8Unorm;
          +        let config = wgpu::SurfaceConfiguration { usage: wgpu::TextureUsages::RENDER_ATTACHMENT | wgpu::TextureUsages::COPY_SRC, format: color_format, color_space: wgpu::SurfaceColorSpace::Auto, width, height, present_mode: wgpu::PresentMode::Fifo, desired_maximum_frame_latency: 2, alpha_mode: wgpu::CompositeAlphaMode::Opaque, view_formats: vec![] };
          +        let depth = create_depth_texture_ms(&device, width, height, 1);
          +        let depth_view = depth.create_view(&Default::default());
          +        Self { instance, adapter, device, queue, surface: None, config, color_format, depth, depth_view, sample_count: 1, msaa_view: None, capture_requested: false, captured: None }
               }
           
               /// The non-sRGB colour format to build pipelines and render surfaces with.
          @@ -259,7 +267,7 @@
                   }
                   self.config.width = width;
                   self.config.height = height;
          -        self.surface.configure(&self.device, &self.config);
          +        self.surface.as_ref().unwrap().configure(&self.device, &self.config);
                   self.create_targets();
               }
           
          @@ -307,16 +315,16 @@
               /// Acquire the next back buffer. `None` means skip this frame (timeout, occluded,
               /// outdated or lost surface; the surface is reconfigured where that helps).
               pub fn acquire(&mut self) -> Option<Frame> {
          -        let texture = match self.surface.get_current_texture() {
          +        let texture = match self.surface.as_ref().unwrap().get_current_texture() {
                       wgpu::CurrentSurfaceTexture::Success(t) => t,
                       wgpu::CurrentSurfaceTexture::Suboptimal(t) => {
                           // Use this one; reconfigure before the next.
                           let frame = self.frame_from(t);
          -                self.surface.configure(&self.device, &self.config);
          +                self.surface.as_ref().unwrap().configure(&self.device, &self.config);
                           return Some(frame);
                       }
                       wgpu::CurrentSurfaceTexture::Outdated | wgpu::CurrentSurfaceTexture::Lost => {
          -                self.surface.configure(&self.device, &self.config);
          +                self.surface.as_ref().unwrap().configure(&self.device, &self.config);
                           return None;
                       }
                       _ => return None,
          --- a/crates/cw-client/Cargo.toml
          +++ b/crates/cw-client/Cargo.toml
          @@ -7,6 +7,11 @@
           description = "Cube World Alpha client (Cube.exe): game controller, input, audio, networking"
           
           [dependencies]
          +sdl2 = "0.38"
          +wgpu = "=30.0.1"
          +wgpu-hal = { version = "=30.0.2", features = ["gles"] }
          +pollster = "0.4"
          +gl = "0.14"
           cw-formats = { path = "../cw-formats" }
           cw-net = { path = "../cw-net" }
           cw-render = { path = "../cw-render" }
          --- a/crates/cw-client/src/main.rs
          +++ b/crates/cw-client/src/main.rs
          @@ -30,7 +30,7 @@
