          edit(r+'scene.rs','if p.kind == 0x3c {','if p.kind == 0x3c {\n                if std::env::var_os("CW_V4_LEAVES").is_none() { continue; }')
          edit(r+'scene.rs','let (lights, dynamic) = gather_lights(&ctx, emitter_lights, &mut timer);','let (lights, dynamic) = if std::env::var_os("CW_V4_LIGHTS").is_some() { gather_lights(&ctx, emitter_lights, &mut timer) } else { (Vec::new(), Vec::new()) };')
          edit(r+'scene.rs','let dist2 = length_sq(float_from_fixed(sub3(centre, cam)));','let dist2 = length_sq(float_from_fixed(sub3(centre, cam)));\n            if std::env::var_os("CW_V4_FULL_PROPS").is_none() && p.flags & 4 != 0 && dist2 > 32.0 * 32.0 && model.size[2] as f32 * p.scale < 1.5 { continue; }')
          edit(r+'scene.rs','gc.item_preview_rotation = hud::item_preview_spin(gc.item_preview_rotation, dt_ms);','if std::env::var_os("CW_V4_SPIN").is_some() { gc.item_preview_rotation = hud::item_preview_spin(gc.item_preview_rotation, dt_ms); }')
          p=Path(r+'app.rs'); s=p.read_text(); s=s.replace('PassKind::Clouds | PassKind::Shadows | PassKind::Stars','PassKind::Clouds | PassKind::Shadows | PassKind::Stars | PassKind::Sun | PassKind::Ribbons'); s=s.replace('    target: wgpu::Texture,','    target: wgpu::Texture,\n    last_stats: (u32,u32,u32),'); s=s.replace('},target,view};','},target,view,last_stats:(0,0,0)};'); s=s.replace('        s.exec.encode(&s.ctx.device, &s.ctx.queue, &mut enc,','        let stats = s.exec.encode(&s.ctx.device, &s.ctx.queue, &mut enc,'); s=s.replace('        s.ctx.queue.submit([enc.finish()]);','        self.last_stats=(stats.draws,stats.render_passes,stats.skipped);\n        s.ctx.queue.submit([enc.finish()]);'); s=s.replace('unsafe { present_mali(tex,fbo,fps); }','let pt=Instant::now(); unsafe { present_mali(tex,fbo,fps); } let present=pt.elapsed(); let st=Instant::now();'); s=s.replace('eprintln!("TIMING update={:?} render={:?} frame={:?}",update,render,start.elapsed());','eprintln!("TIMING update={:?} render={:?} present={:?} swap={:?} frame={:?} draws={} passes={} skipped={}",update,render,present,st.elapsed(),start.elapsed(),sink.last_stats.0,sink.last_stats.1,sink.last_stats.2);'); p.write_text(s)
          # Flat per-face terrain colour removes four costly ambient-occlusion/light samples per quad.
