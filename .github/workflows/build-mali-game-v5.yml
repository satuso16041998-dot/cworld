          p=Path(root+'ps01_world.wgsl'); s=p.read_text(); a=s.index('@fragment'); p.write_text(s[:a]+'@fragment\nfn fs_main(in: WorldPsIn) -> @location(0) vec4<f32> {\n    let fog = saturate(in.texcoord0.w * 0.65);\n    return vec4<f32>(mix(in.color.xyz, ps.fogColor.xyz, fog), ps.alpha.x);\n}\n')
          p=Path(root+'ps03_water.wgsl'); s=p.read_text(); a=s.index('@fragment'); p.write_text(s[:a]+'@fragment\nfn fs_main(in: WorldPsIn) -> @location(0) vec4<f32> {\n    let base = vec3<f32>(0.04, 0.36, 0.72) * in.color.z;\n    return vec4<f32>(mix(base, ps.fogColor.xyz, saturate(in.texcoord0.w)), 0.85);\n}\n')
