          PY_V4
      - name: V5 performance patch
        run: |
          python3 - <<'PY_V5'
          from pathlib import Path
          import re
          
          def edit(p, a, b):
              p=Path(p); s=p.read_text(); assert s.count(a)==1,(str(p),a,s.count(a)); p.write_text(s.replace(a,b))
          r=Path('crates/cw-client/src'); m=Path('crates/cw-render/src/mesh.rs')
          # Cache toggles at first use, no repeated getenv in hot loops.
          for p in [r/'scene.rs',m]:
              s=p.read_text()
              s=re.sub(r'std::env::var_os\("(CW_V4_[A-Z_]+)"\).is_some\(\)',lambda x:'{ static FLAG: std::sync::OnceLock<bool> = std::sync::OnceLock::new(); *FLAG.get_or_init(|| std::env::var_os("'+x[1]+'").is_some()) }',s)
              s=re.sub(r'std::env::var_os\("(CW_V4_[A-Z_]+)"\).is_none\(\)',lambda x:'!{ static FLAG: std::sync::OnceLock<bool> = std::sync::OnceLock::new(); *FLAG.get_or_init(|| std::env::var_os("'+x[1]+'").is_some()) }',s)
              p.write_text(s)
          # Merge coplanar opaque unit faces of identical packed colour; preserve water and winding.
          helper = r"""
          fn h700_merge(slab: &mut ChunkMesh) {
              use std::collections::{BTreeMap, BTreeSet};
              let mut groups: BTreeMap<(u8,u8,u32), BTreeSet<(u8,u8)>> = BTreeMap::new();
              let mut vertices = Vec::new();
              let mut indices = Vec::new();
              let mut indices2 = Vec::new();
              for (src,dst,merge) in [(&slab.indices,&mut indices,true),(&slab.indices2,&mut indices2,false)] {
                  for q in src.chunks_exact(6) {
                      let vs = [slab.vertices[q[0] as usize],slab.vertices[q[1] as usize],slab.vertices[q[2] as usize],slab.vertices[q[5] as usize]];
                      let face=vs[0].pos[3]; let axis=(face/2) as usize;
                      let u=(axis+1)%3; let v=(axis+2)%3;
                      let lo_u=vs.iter().map(|x|x.pos[u]).min().unwrap();
                      let lo_v=vs.iter().map(|x|x.pos[v]).min().unwrap();
                      if merge && vs.iter().all(|x|x.color==vs[0].color && x.pos[axis]==vs[0].pos[axis]) {
                          groups.entry((face,vs[0].pos[axis],vs[0].color)).or_default().insert((lo_u,lo_v));
                      } else {
                          let b=vertices.len() as u32; vertices.extend_from_slice(&vs); dst.extend_from_slice(&[b,b+1,b+2,b,b+2,b+3]);
                      }
                  }
              }
              for ((face,plane,color),mut cells) in groups {
                  let axis=(face/2) as usize; let u=(axis+1)%3; let v=(axis+2)%3;
                  let (_,corners)=FACES.iter().find(|(n,_)|face_index(*n)==face).unwrap();
                  while let Some(&(x,y))=cells.first() {
                      let mut w=1u8; let mut h=1u8;
                      while x.checked_add(w).is_some_and(|xx| xx<255 && cells.contains(&(xx,y))) {w+=1;}
                      while y.checked_add(h).is_some_and(|yy| yy<255 && (0..w).all(|dx|cells.contains(&(x+dx,yy)))) {h+=1;}
                      for dx in 0..w {for dy in 0..h {cells.remove(&(x+dx,y+dy));}}
                      let b=vertices.len() as u32;
                      for c in corners {let mut pos=[0u8;4];pos[3]=face;pos[axis]=plane;pos[u]=x+if c[u]==0{0}else{w};pos[v]=y+if c[v]==0{0}else{h};vertices.push(WorldVertex{pos,color});}
                      indices.extend_from_slice(&[b,b+1,b+2,b,b+2,b+3]);
                  }
              }
              slab.vertices=vertices; slab.indices=indices; slab.indices2=indices2;
          }
          """
          s=m.read_text(); anchor='/// A voxel model\'s mesh'; assert s.count(anchor)==1; s=s.replace(anchor,helper+'\n'+anchor)
          s=s.replace('    let mut props = Vec::new();\n    access.write', '    static MERGE: std::sync::OnceLock<bool> = std::sync::OnceLock::new();\n    if *MERGE.get_or_init(|| std::env::var_os("CW_V5_NO_MERGE").is_none()) { for slab in &mut slabs { h700_merge(slab); } }\n    let mut props = Vec::new();\n    access.write')
          s=s.replace('let ao = grid.occlusion(p[0], p[1], p[2], normal);','let ao = { static AO: std::sync::OnceLock<bool> = std::sync::OnceLock::new(); if *AO.get_or_init(|| std::env::var_os("CW_V5_MODEL_AO").is_some()) { grid.occlusion(p[0], p[1], p[2], normal) } else { 1.0 } };')
          m.write_text(s)
          # Preset-dependent decoration and particles, never change creature visibility.
          p=r/'scene.rs'; s=p.read_text(); a='let dist2 = length_sq(float_from_fixed(sub3(centre, cam)));'; assert s.count(a)==1
          s=s.replace(a,a+'\n            let cutoff = { static P: std::sync::OnceLock<f32> = std::sync::OnceLock::new(); *P.get_or_init(|| match std::env::var("CW_V5_PROFILE").as_deref() { Ok("potato") => 16.0, Ok("balanced") => 48.0, _ => 24.0 }) };\n            if p.flags & 4 != 0 && dist2 > cutoff*cutoff && sz as f32 * p.scale < 3.0 { continue; }'); p.write_text(s)
          p=r/'particles.rs'; s=p.read_text(); s=s.replace('self.particles.len() < 96','self.particles.len() < { static CAP: std::sync::OnceLock<usize> = std::sync::OnceLock::new(); *CAP.get_or_init(|| match std::env::var("CW_V5_PROFILE").as_deref() { Ok("potato") => 8, Ok("balanced") => 64, _ => 24 }) }'); p.write_text(s)
          # Limit cosmetic whirl draw count, leave combat simulation intact.
          p=r/'scene/creatures.rs'; s=p.read_text(); a='for i in 0..count.max(0) {'; assert s.count(a)>=2
          s=s.replace(a,'for i in 0..count.max(0).min({ static CAP: std::sync::OnceLock<i32> = std::sync::OnceLock::new(); *CAP.get_or_init(|| match std::env::var("CW_V5_PROFILE").as_deref() { Ok("potato") => 4, Ok("balanced") => 24, _ => 10 }) }) {'); p.write_text(s)
          # Render target resolution selected at startup; logical UI size remains unchanged.
          p=r/'app.rs'; s=p.read_text(); a=s.index('struct MaliSink'); head=s[:a]; t=s[a:]
          t=t.replace('    target: wgpu::Texture,','    target: wgpu::Texture,\n    width: u32, height: u32,')
          t=t.replace('&s.ctx.depth_view, 640, 480)', '&s.ctx.depth_view, self.width, self.height)')
          t=t.replace('let ctx = GpuContext::external(instance,adapter,device,queue,640,480);','let (rw,rh) = match std::env::var("CW_V5_PROFILE").as_deref() { Ok("potato") => (320u32,240u32), Ok("balanced") => (640,480), _ => (480,360) };\n    eprintln!("V5 target {rw}x{rh}");\n    let ctx = GpuContext::external(instance,adapter,device,queue,rw,rh);')
          t=t.replace('width:640,height:480,depth_or_array_layers:1','width:rw,height:rh,depth_or_array_layers:1')
          t=t.replace('},target,view,last_stats:', '},target,view,width:rw,height:rh,last_stats:')
          t=t.replace('present_mali(tex,fbo,fps)', 'present_mali(tex,fbo,rw as i32,rh as i32)')
          t=t.replace('tex:u32,fbo:u32,fps:u32','tex:u32,fbo:u32,rw:i32,rh:i32')
          t=t.replace('gl::BlitFramebuffer(0,0,640,480,0,0,640,480','gl::BlitFramebuffer(0,0,rw,rh,0,0,640,480')
          a=t.index('        gl::ColorMask(1,1,1,1);'); b=t.index('        gl::ClearColor(clear[0]',a); t=t[:a]+t[b:]
          # Correct logical-to-target scaling; the entire framebuffer is scaled, including UI.
          t=t.replace('c.set_back_buffer(640,480,0.5);','c.set_back_buffer(rw,rh,rw as f64 / 1280.0);')
          # Avoid redundant GL queries and framebuffer validation on every frame.
          a=t.index('        let mut old=[0i32;7];',t.index('unsafe fn present_mali'))
          t=t[:a]+"""        let mut old=[0i32;2];
                  gl::GetIntegerv(gl::READ_FRAMEBUFFER_BINDING,&mut old[0]);
                  gl::GetIntegerv(gl::DRAW_FRAMEBUFFER_BINDING,&mut old[1]);
                  let sc=gl::IsEnabled(gl::SCISSOR_TEST);
                  gl::BindFramebuffer(gl::READ_FRAMEBUFFER,fbo);
                  static ATTACHED: std::sync::OnceLock<()> = std::sync::OnceLock::new();
                  ATTACHED.get_or_init(|| { gl::FramebufferTexture2D(gl::READ_FRAMEBUFFER,gl::COLOR_ATTACHMENT0,gl::TEXTURE_2D,tex,0); assert_eq!(gl::CheckFramebufferStatus(gl::READ_FRAMEBUFFER),gl::FRAMEBUFFER_COMPLETE); });
                  gl::BindFramebuffer(gl::DRAW_FRAMEBUFFER,0);
                  gl::Disable(gl::SCISSOR_TEST);
                  gl::BlitFramebuffer(0,0,rw,rh,0,0,640,480,gl::COLOR_BUFFER_BIT,gl::NEAREST);
                  if sc!=0 {gl::Enable(gl::SCISSOR_TEST);}
                  gl::BindFramebuffer(gl::READ_FRAMEBUFFER,old[0] as u32);
                  gl::BindFramebuffer(gl::DRAW_FRAMEBUFFER,old[1] as u32);
              }
          }
          """
          p.write_text(head+t)
          PY_V5
      - name: Build ARM64
        env:
          RUSTFLAGS: '-C target-cpu=cortex-a53'
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
        run: cargo build --release -p cw-client -p cw-server
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/cw-client dist/cw-client-mali-v5
          cp target/release/cw-server dist/cw-server
          file dist/*
          (cd dist && sha256sum cw-client-mali-v5 cw-server > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: CubeWorld-Mali-Native-H700-V5
          path: dist/
          if-no-files-found: error
