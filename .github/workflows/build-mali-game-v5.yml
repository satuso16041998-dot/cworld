          -    let lit = in.color.z * base + spec;
          +    let lit = in.color.z * base;
           
               let fogged = mix(lit, ps.fogColor.xyz, saturate(d3));
               let to_sky = saturate((d3 - 0.5) + (d3 - 0.5));
          --- a/crates/cw-client/src/app.rs
          +++ b/crates/cw-client/src/app.rs
          @@ -1095,3 +1095,118 @@
                   assert_eq!(vk_of(KeyCode::Enter), Some(0x0d));
               }
           }
          +
          +
          +struct MaliSink {
          +    inner: ExecSink,
          +    target: wgpu::Texture,
          +    view: wgpu::TextureView,
          +    read: wgpu::Buffer,
          +    pixels: Vec<u8>,
          +}
          +impl FrameSink for MaliSink {
          +    fn resize(&mut self, _: u32, _: u32) {}
          +    fn render(&mut self, frame: &FrameCommands, mut r: FrameResources<'_>) {
          +        let s = &mut self.inner;
          +        crate::assets::upload(&s.ctx, &mut s.res, std::mem::take(&mut r.upload));
          +        let mut frame = frame.clone();
          +        use cw_render::frame::PassKind;
          +        frame.passes.retain(|p| !matches!(p.kind, PassKind::Clouds | PassKind::Shadows | PassKind::Stars));
          +        s.sync(&frame, &r);
          +        let mut enc = s.ctx.device.create_command_encoder(&Default::default());
          +        s.exec.encode(&s.ctx.device, &s.ctx.queue, &mut enc, cw_render::gpu::exec::FrameTarget::new(&self.view, &s.ctx.depth_view, 640, 480), &frame, &mut s.res);
          +        enc.copy_texture_to_buffer(wgpu::TexelCopyTextureInfo { texture: &self.target, mip_level: 0, origin: wgpu::Origin3d::ZERO, aspect: wgpu::TextureAspect::All }, wgpu::TexelCopyBufferInfo { buffer: &self.read, layout: wgpu::TexelCopyBufferLayout { offset: 0, bytes_per_row: Some(2560), rows_per_image: Some(480) } }, wgpu::Extent3d { width: 640, height: 480, depth_or_array_layers: 1 });
          +        s.ctx.queue.submit([enc.finish()]);
          +        self.read.map_async(wgpu::MapMode::Read, .., |_| {});
          +        s.ctx.device.poll(wgpu::PollType::wait_indefinitely()).expect("GPU poll");
          +        { let v = self.read.get_mapped_range(..).expect("readback"); self.pixels.copy_from_slice(&v); }
          +        self.read.unmap();
          +    }
          +}
          +
          +pub fn run_mali(args: Args) -> Result<(), String> {
          +    use sdl2::{event::Event, keyboard::Keycode, mouse::MouseButton as SMouse};
          +    let sdl = sdl2::init()?;
          +    let video = sdl.video()?;
          +    let attr = video.gl_attr();
          +    attr.set_context_profile(sdl2::video::GLProfile::GLES);
          +    attr.set_context_version(3,0);
          +    let window = video.window("Cube World Mali",640,480).opengl().fullscreen().build().map_err(|e|e.to_string())?;
          +    let context = window.gl_create_context()?;
          +    window.gl_make_current(&context)?;
          +    gl::load_with(|n| video.gl_get_proc_address(n) as *const _);
          +    let exposed = unsafe { wgpu_hal::gles::Adapter::new_external(|n| video.gl_get_proc_address(n) as *const _, Default::default()) }.ok_or("external adapter failed")?;
          +    let instance = wgpu::Instance::new(wgpu::InstanceDescriptor::new_without_display_handle());
          +    let adapter = unsafe { instance.create_adapter_from_hal(exposed) };
          +    eprintln!("MALI_ADAPTER {:?}", adapter.get_info());
          +    let features = adapter.features() & (wgpu::Features::ADDRESS_MODE_CLAMP_TO_BORDER | wgpu::Features::TEXTURE_ADAPTER_SPECIFIC_FORMAT_FEATURES);
          +    let (device,queue) = pollster::block_on(adapter.request_device(&wgpu::DeviceDescriptor { required_limits: adapter.limits(), required_features: features, ..Default::default() })).map_err(|e|e.to_string())?;
          +    let ctx = GpuContext::external(instance,adapter,device,queue,640,480);
          +    let exec = Executor::new(&ctx.device,&ctx.queue,ctx.color_format());
          +    let res = Resources::new(&ctx.device,ctx.color_format());
          +    let target = ctx.device.create_texture(&wgpu::TextureDescriptor { label: Some("native frame"), size: wgpu::Extent3d {width:640,height:480,depth_or_array_layers:1}, mip_level_count:1,sample_count:1,dimension:wgpu::TextureDimension::D2,format:wgpu::TextureFormat::Rgba8Unorm,usage:wgpu::TextureUsages::RENDER_ATTACHMENT|wgpu::TextureUsages::COPY_SRC,view_formats:&[] });
          +    let view = target.create_view(&Default::default());
          +    let read = ctx.device.create_buffer(&wgpu::BufferDescriptor {label:Some("native readback"),size:640*480*4,usage:wgpu::BufferUsages::COPY_DST|wgpu::BufferUsages::MAP_READ,mapped_at_creation:false});
          +    let mut sink = MaliSink {inner:ExecSink {ctx,exec,res,chunk_versions:Vec::new(), #[cfg(feature="debug-overlay")] overlay:Default::default()},target,view,read,pixels:vec![0;640*480*4]};
          +    let mut c = Controller::new(default_game_dir(),[960,720],vec![(960,720)],args.server_flag,args.server_address);
          +    c.options.anti_aliasing=0; c.options.render_distance=25;
          +    c.set_back_buffer(640,480,2.0/3.0); c.on_resize(960,720);
          +    let mut events=sdl.event_pump()?;
          +    let mut last=Instant::now(); let mut tick=last; let mut count=0u32; let mut fps=0u32;
          +    let mut free=true; let mut tex=0; let mut fbo=0;
          +    unsafe { gl::GenTextures(1,&mut tex); gl::GenFramebuffers(1,&mut fbo); }
          +    eprintln!("MALI_GAME_LOOP_OK");
          +    while !c.quit {
          +        let start=Instant::now();
          +        let now_free=c.is_cursor_free();
          +        if free!=now_free { free=now_free; sdl.mouse().set_relative_mouse_mode(!free); }
          +        for event in events.poll_iter() {
          +            match event {
          +                Event::Quit{..}=>c.quit=true,
          +                Event::MouseMotion{x,y,xrel,yrel,..}=>if free {c.on_mouse_move(x as f32*1.5,y as f32*1.5)} else {c.on_mouse_move(xrel as f32,yrel as f32)},
          +                Event::MouseButtonDown{mouse_btn,..}|Event::MouseButtonUp{mouse_btn,..}=>{
          +                    let down=matches!(event,Event::MouseButtonDown{..});
          +                    let b=match mouse_btn {SMouse::Left=>MouseButton::Left,SMouse::Right=>MouseButton::Right,SMouse::Middle=>MouseButton::Middle,_=>continue};
          +                    c.input.buttons[b as usize]=down; if down {c.on_mouse_down(b)} else {c.on_mouse_up(b)}
          +                },
          +                Event::MouseWheel{y,..}=>c.on_mouse_wheel(y.signum()),
          +                Event::TextInput{text,..}=>for u in text.encode_utf16(){c.on_char(u)},
          +                Event::KeyDown{keycode:Some(k),..}|Event::KeyUp{keycode:Some(k),..}=>{
          +                    let down=matches!(event,Event::KeyDown{..});
          +                    let key=match k {Keycode::A=>KeyCode::KeyA,Keycode::B=>KeyCode::KeyB,Keycode::C=>KeyCode::KeyC,Keycode::D=>KeyCode::KeyD,Keycode::E=>KeyCode::KeyE,Keycode::F=>KeyCode::KeyF,Keycode::G=>KeyCode::KeyG,Keycode::H=>KeyCode::KeyH,Keycode::I=>KeyCode::KeyI,Keycode::J=>KeyCode::KeyJ,Keycode::K=>KeyCode::KeyK,Keycode::L=>KeyCode::KeyL,Keycode::M=>KeyCode::KeyM,Keycode::N=>KeyCode::KeyN,Keycode::O=>KeyCode::KeyO,Keycode::P=>KeyCode::KeyP,Keycode::Q=>KeyCode::KeyQ,Keycode::R=>KeyCode::KeyR,Keycode::S=>KeyCode::KeyS,Keycode::T=>KeyCode::KeyT,Keycode::U=>KeyCode::KeyU,Keycode::V=>KeyCode::KeyV,Keycode::W=>KeyCode::KeyW,Keycode::X=>KeyCode::KeyX,Keycode::Y=>KeyCode::KeyY,Keycode::Z=>KeyCode::KeyZ,Keycode::Num0=>KeyCode::Digit0,Keycode::Num1=>KeyCode::Digit1,Keycode::Num2=>KeyCode::Digit2,Keycode::Num3=>KeyCode::Digit3,Keycode::Num4=>KeyCode::Digit4,Keycode::Num5=>KeyCode::Digit5,Keycode::Num6=>KeyCode::Digit6,Keycode::Num7=>KeyCode::Digit7,Keycode::Num8=>KeyCode::Digit8,Keycode::Num9=>KeyCode::Digit9,Keycode::Space=>KeyCode::Space,Keycode::Escape=>KeyCode::Escape,Keycode::Return=>KeyCode::Enter,Keycode::Tab=>KeyCode::Tab,Keycode::LShift=>KeyCode::ShiftLeft,Keycode::LCtrl=>KeyCode::ControlLeft,Keycode::Backspace=>KeyCode::Backspace,Keycode::F1=>KeyCode::F1, _=>continue};
          +                    if let Some(d)=dik_of(key){if down{c.input.press(d)}else{c.input.release(d)}}
          +                    if let Some(v)=vk_of(key){if down{c.on_key_down(v)}else{c.on_key_up(v)}}
          +                }, _=>{}
          +            }
          +        }
          +        if c.quit {break}
          +        let dt=start.duration_since(last).as_millis().min(250) as i32; last=start;
          +        c.update(dt); c.render(&mut sink);
          +        count+=1; if tick.elapsed().as_secs_f32()>=1.0 {fps=(count as f32/tick.elapsed().as_secs_f32()).round() as u32; eprintln!("FPS {fps}"); count=0;tick=Instant::now();}
          +        unsafe { present_mali(tex,fbo,&sink.pixels,fps); }
          +        window.gl_swap_window();
          +        let sleep=c.options.frame_sleep_ms(start.elapsed().as_millis() as i32); if sleep>0 {std::thread::sleep(Duration::from_millis(sleep.into()));}
          +    }
          +    c.shutdown(); drop(sink); unsafe {gl::DeleteTextures(1,&tex);gl::DeleteFramebuffers(1,&fbo);} drop(context); Ok(())
          +}
          +
          +unsafe fn present_mali(tex:u32,fbo:u32,pixels:&[u8],fps:u32) {
          +    unsafe {
          +        let mut old=[0i32;7];
          +        for (i,p) in [gl::TEXTURE_BINDING_2D,gl::READ_FRAMEBUFFER_BINDING,gl::DRAW_FRAMEBUFFER_BINDING,gl::PIXEL_UNPACK_BUFFER_BINDING,gl::UNPACK_ALIGNMENT,gl::UNPACK_ROW_LENGTH,gl::UNPACK_SKIP_ROWS].into_iter().enumerate(){gl::GetIntegerv(p,&mut old[i]);}
